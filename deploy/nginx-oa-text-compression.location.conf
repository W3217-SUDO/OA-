# 仅在 OA 站点现有的 API 与静态资源代理 location 中引入，不修改转发或缓冲配置。
gzip on;
gzip_vary on;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css;

# 流式事件及二进制文件不在类型白名单内；认证、办公编辑器和附件路径保持原传输行为。
if ($uri ~ "(^|/)(auth|office|cool|lool|browser|hosting|attachments)(/|$)") {
    gzip off;
}
