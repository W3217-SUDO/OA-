name: Code quality

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      SEED_DEMO_DATA: 'false'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Check delivery verification runtime
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r apps/api-server/requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci --prefix apps/admin-web
      - name: Check regression runner
        working-directory: apps/api-server
        run: |
          python -m unittest tests.test_regression_runner

      - name: Run quality gate
        run: python scripts/quality_gate.py --profile static --report-dir "$RUNNER_TEMP/oa-quality" --jobs 2
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/oa-quality
          if-no-files-found: error
