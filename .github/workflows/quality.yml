name: Code quality

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oa_quality
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oa_quality -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OA_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_reliability
      OUTBOX_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_outbox
      AGENT_COMMANDS_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      INCOMING_QUERY_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      ARCHIVE_EVIDENCE_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      FILE_IO_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      CUSTOMER_TASK_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      BUSINESS_RULE_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      FINANCE_SELECTED_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      TASK_PROJECTION_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      TASK_QUERY_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      DASHBOARD_DATES_TEST_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      OA_TEST_POSTGRES_DSN: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_boundaries
      OA_ROUTE_EFFECTS_POSTGRES_URL: postgresql+asyncpg://oa_quality@127.0.0.1:5432/oa_test_enterprise_commands
      APP_ENV: testing
      SEED_DEMO_DATA: 'false'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Check delivery verification runtime
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r apps/api-server/requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci --prefix apps/admin-web
          npm exec --yes --package=pnpm@11.24.0 -- pnpm --dir apps/deepseek-harness-host install --frozen-lockfile
      - name: Create isolated test databases
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://oa_quality@127.0.0.1:5432/postgres', autocommit=True) as db:
              for name in ('oa_test_enterprise_reliability', 'oa_test_enterprise_outbox', 'oa_test_enterprise_commands', 'oa_test_enterprise_boundaries'):
                  db.execute(psycopg.sql.SQL('CREATE DATABASE {}').format(psycopg.sql.Identifier(name)))
          PY
      - name: Run quality gate
        run: python scripts/quality_gate.py --report-dir "$RUNNER_TEMP/oa-quality" --jobs 2
      - name: Build production images
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker build -t oa-api-quality apps/api-server
          docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" -t oa-web-quality apps/admin-web
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: ${{ runner.temp }}/oa-quality
          if-no-files-found: error
