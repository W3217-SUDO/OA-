# 代码审查报告，第一阶段只提示：独立于 quality.yml，失败不影响任何发布。
# 发布提交带 [skip ci]，推送时大多不会触发，所以每晚再跑一次，覆盖当天全部改动。
name: Code review report

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '30 18 * * *'  # 北京时间 02:30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    env:
      APP_ENV: testing
      SEED_DEMO_DATA: 'false'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r apps/api-server/requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m venv "$RUNNER_TEMP/review-tools"
          "$RUNNER_TEMP/review-tools/bin/python" -m pip install --require-hashes -r requirements-review.lock
          npm ci --prefix apps/admin-web
      - name: Test report tooling
        run: python -m unittest discover -s tests/review -p 'test_*.py'
      - name: Build report
        env:
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          [ -n "$base" ] || base=$(git rev-list -1 --before='24 hours ago' HEAD)
          python scripts/review/report.py --base "$base" --tools-python "$RUNNER_TEMP/review-tools/bin/python" \
            --audit --coverage all --coverage-timeout 1800 --deadline 2100 --jobs 2 --report-dir "$RUNNER_TEMP/review-report"
          cat "$RUNNER_TEMP/review-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: ${{ runner.temp }}/review-report
          if-no-files-found: warn
