# Low-memory override for the non-production 2 GB Tencent Lighthouse test host.
# Usage:
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f compose.prod.yml -f compose.test-server.yml up -d

services:
  postgres:
    cpus: 1.0
    mem_limit: 384m

  redis:
    cpus: 0.5
    mem_limit: 128m

  minio:
    cpus: 0.75
    mem_limit: 320m

  api:
    cpus: 1.0
    mem_limit: 384m

  worker:
    command:
      - celery
      - -A
      - app.worker.celery
      - worker
      - --loglevel=INFO
      - --concurrency=1
    cpus: 0.75
    mem_limit: 320m

  web:
    cpus: 0.5
    mem_limit: 128m
